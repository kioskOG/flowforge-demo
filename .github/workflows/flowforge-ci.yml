name: FlowForge CI

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: "flowforge-ci-${{ github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  source-scan:
    name: dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Org policy: fail on CRITICAL vulnerabilities that have a fix, in any lockfile Trivy reads (every ecosystem), and on committed secrets.
      - name: Scan dependencies and committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
